<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Dashboard · Crew Management</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --green: #4e8b65; --green-dark: #286044; --green-pale: #edf5ef;
    --ink: #26332c; --muted: #6b776f; --line: #d9e1db;
    --paper: #ffffff; --canvas: #f3f6f3; --yellow: #fff4bd; --red: #c0392b;
  }
  body { margin: 0; background: var(--canvas); color: var(--ink);
         font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; }
  .page { max-width: 1400px; margin: 0 auto; padding: 26px 24px 20px; }

  .page-header { display: flex; justify-content: space-between; align-items: end;
                 gap: 20px; padding: 4px 2px 22px; border-bottom: 1px solid var(--line);
                 margin-bottom: 18px; flex-wrap: wrap; }
  .eyebrow { margin: 0 0 7px; color: var(--green-dark); font-size: 10px;
             font-weight: 800; letter-spacing: 2px; }
  h1 { margin: 0; font-size: clamp(23px, 3vw, 30px); letter-spacing: -.7px;
       font-weight: 700; }
  .subtitle { color: var(--muted); margin: 6px 0 0; }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border: 1px solid transparent; border-radius: 7px; padding: 8px 14px;
         font: inherit; font-weight: 650; cursor: pointer; text-decoration: none;
         color: #425047; background: #f7f9f7; border-color: var(--line);
         transition: .15s ease; display: inline-block; }
  .btn:hover { transform: translateY(-1px); filter: brightness(.97); }
  .btn-dark { background: var(--green-dark); color: white; border-color: var(--green-dark); }

  /* tabs */
  .tabs-wrap { background: #fff; border: 1px solid var(--line); border-radius: 10px;
               overflow: hidden; margin-bottom: 18px; }
  .tabs { display: flex; overflow-x: auto; gap: 0; scrollbar-width: thin;
          border-bottom: 1px solid var(--line); }
  .tab { padding: 12px 18px; cursor: pointer; font-size: 12.5px; font-weight: 650;
         color: var(--muted); background: transparent; border: none;
         border-bottom: 3px solid transparent; white-space: nowrap;
         transition: .15s ease; font-family: inherit; }
  .tab:hover { color: var(--ink); background: #fafcfa; }
  .tab.active { color: var(--green-dark); border-bottom-color: var(--green-dark);
                background: var(--green-pale); }
  .tab-count { font-size: 10px; font-weight: 800; margin-left: 5px;
               padding: 2px 6px; border-radius: 8px; background: rgba(0,0,0,.06); }
  .tab.active .tab-count { background: rgba(40,96,68,.15); }

  /* content */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .tab-header { display: flex; justify-content: space-between; align-items: center;
                gap: 12px; padding: 0 4px 14px; flex-wrap: wrap; }
  .tab-header h2 { margin: 0; font-size: 18px; font-weight: 700; }
  .tab-header .meta { color: var(--muted); font-size: 11.5px; }
  .tab-header .meta strong { color: var(--green-dark); }
  .tab-header .progress { display: flex; align-items: center; gap: 10px; }
  .progress-bar { width: 180px; height: 8px; border-radius: 4px;
                  background: #e5ece6; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--green); transition: width .3s; }

  .cards-grid { display: grid; gap: 12px;
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .card-tile { display: flex; flex-direction: column; gap: 8px;
               padding: 16px 16px 14px; background: #fff; border: 1px solid var(--line);
               border-radius: 10px; text-decoration: none; color: inherit;
               transition: .15s ease; position: relative; }
  .card-tile:hover { transform: translateY(-2px);
                     box-shadow: 0 6px 18px rgba(28,55,37,.08);
                     border-color: var(--green); }
  .card-tile.loaded { border-left: 4px solid var(--green); }
  .card-tile.empty  { border-left: 4px solid #c9d3cb; }

  .card-tile .row1 { display: flex; justify-content: space-between;
                     align-items: flex-start; gap: 8px; }
  .card-tile .cat-label { font-weight: 800; font-size: 12px;
                          letter-spacing: .5px; color: var(--ink); }
  .card-tile .cat-title { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .card-tile .status-dot { width: 8px; height: 8px; border-radius: 50%;
                           background: #c9d3cb; flex-shrink: 0; margin-top: 4px; }
  .card-tile.loaded .status-dot { background: var(--green); }

  .card-tile .count { font-size: 22px; font-weight: 800; color: var(--green-dark); }
  .card-tile .count.empty-num { color: #b3bdb5; font-size: 15px; font-weight: 600; }
  .card-tile .count-label { font-size: 10.5px; color: var(--muted);
                            text-transform: uppercase; letter-spacing: .5px; }

  .card-tile .arrow { position: absolute; right: 14px; bottom: 14px;
                      color: var(--muted); font-size: 14px; transition: .15s; }
  .card-tile:hover .arrow { color: var(--green-dark); transform: translateX(2px); }

  footer { color: #87928a; font-size: 10.5px; display: flex;
           justify-content: space-between; padding: 12px 4px 12px; margin-top: 20px; }

  @media (max-width: 700px) {
    .page { padding: 16px 10px; }
    .page-header { align-items: flex-start; flex-direction: column; }
    .progress-bar { width: 120px; }
  }
</style>
</head>
<body>
<main class="page">

  <header class="page-header">
    <div>
      <p class="eyebrow">NAGPUR DIVISION</p>
      <h1>Data Dashboard</h1>
      <p class="subtitle">Choose a lobby, then load or update any category</p>
    </div>
    <div class="header-actions">
      <a href="index.html" class="btn">← Home</a>
      <a href="mastertable.html" class="btn btn-dark">View Staff Position →</a>
    </div>
  </header>

  <div class="tabs-wrap">
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>

  <div id="tabContents"></div>

  <footer>
    <span>NGP Division · Data Dashboard</span>
    <span id="footerDate"></span>
  </footer>

</main>

<script type="module">
  import { db } from './firebase-init.js';
  import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  (function () {
    "use strict";

    var LOBBY_KEYS = {
      "NGP + GNQ": "NGP_GNQ", "AMLA+JNO": "AMLA_JNO", "DHQ": "DHQ", "TEO": "TEO",
      "BPQ": "BPQ", "GGS": "GGS", "TAE": "TAE", "MJRI": "MJRI",
      "WR": "WR", "BTBR": "BTBR"
    };

    var COLUMNS = [
      { key: "ONLINE",  label: "ON / LINE",         title: "On-line crew" },
      { key: "REST",    label: "REST",              title: "Rest crew" },
      { key: "GOC",     label: "GOC",               title: "GOC crew" },
      { key: "SPLDUTY", label: "SPL DUTY",          title: "Special duty" },
      { key: "INSTBSL", label: "INST BSL",          title: "Installation basel" },
      { key: "LR",      label: "L/R",               title: "L/R crew" },
      { key: "MISC",    label: "MISC (TA/ENQ/SUS)", title: "Miscellaneous" },
      { key: "TRGBSL",  label: "TRG BSL",           title: "Training basel" },
      { key: "LEAVE",   label: "LEAVE",             title: "On leave" },
      { key: "SPLCL",   label: "SPL CL",            title: "Special casual leave" },
      { key: "SICK",    label: "SICK",              title: "Sick" },
      { key: "ABSENT",  label: "ABSENT",            title: "Absent" },
      { key: "DTCAJNI", label: "DTC AJNI",          title: "DTC Ajni" },
      { key: "PME",     label: "PME",               title: "PME" },
      { key: "SNPOST",  label: "S/N POST",          title: "S/N post" }
    ];

    // Global variable to hold live Firebase data
    let ALL_CLOUD_DATA = {};

    function getStorageCount(lobbyKey, colKey) {
      if (ALL_CLOUD_DATA[lobbyKey] && ALL_CLOUD_DATA[lobbyKey][colKey]) {
        return ALL_CLOUD_DATA[lobbyKey][colKey].length;
      }
      return null; // Not loaded yet
    }

    function getLobbySummary(lobbyKey) {
      var loaded = 0, total = 0;
      COLUMNS.forEach(function (col) {
        var c = getStorageCount(lobbyKey, col.key);
        if (c !== null) { loaded++; total += c; }
      });
      return { loaded: loaded, total: total, max: COLUMNS.length };
    }

    function escapeHtml(v) {
      return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
        return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
      });
    }

    var tabsEl = document.getElementById("tabs");
    var contentsEl = document.getElementById("tabContents");
    var activeLobby = null;

    function renderTabs() {
      tabsEl.innerHTML = "";
      Object.keys(LOBBY_KEYS).forEach(function (lobby, i) {
        var summary = getLobbySummary(LOBBY_KEYS[lobby]);
        var tab = document.createElement("button");
        tab.type = "button";
        tab.className = "tab" + (lobby === activeLobby ? " active" : "");
        tab.dataset.lobby = lobby;
        tab.innerHTML = escapeHtml(lobby) +
          '<span class="tab-count">' + summary.loaded + "/" + summary.max + "</span>";
        tab.addEventListener("click", function () { activateLobby(lobby); });
        tabsEl.appendChild(tab);
      });
    }

    function renderLobbyContent(lobby) {
      var lobbyKey = LOBBY_KEYS[lobby];
      var summary = getLobbySummary(lobbyKey);

      var progressPct = Math.round((summary.loaded / summary.max) * 100);

      var html =
        '<div class="tab-header">' +
          '<div>' +
            '<h2>' + escapeHtml(lobby) + '</h2>' +
            '<p class="meta"><strong>' + summary.loaded + '/' + summary.max +
              '</strong> categories loaded · <strong>' + summary.total +
              '</strong> crew total</p>' +
          '</div>' +
          '<div class="progress">' +
            '<div class="progress-bar"><div class="progress-fill" style="width:' +
              progressPct + '%"></div></div>' +
            '<span class="meta"><strong>' + progressPct + '%</strong></span>' +
          '</div>' +
        '</div>' +
        '<div class="cards-grid">';

      COLUMNS.forEach(function (col) {
        var count = getStorageCount(lobbyKey, col.key);
        var loaded = count !== null;
        var filename = lobbyKey + "_" + col.key + ".html";

        html += '<a class="card-tile ' + (loaded ? "loaded" : "empty") + '" href="' +
                escapeHtml(filename) + '">' +
                '<div class="row1">' +
                  '<div>' +
                    '<div class="cat-label">' + escapeHtml(col.label) + '</div>' +
                    '<div class="cat-title">' + escapeHtml(col.title) + '</div>' +
                  '</div>' +
                  '<span class="status-dot" title="' +
                    (loaded ? "Loaded" : "Not loaded") + '"></span>' +
                '</div>' +
                '<div>' +
                  '<div class="count' + (loaded ? "" : " empty-num") + '">' +
                    (loaded ? count : "—") + '</div>' +
                  '<div class="count-label">' +
                    (loaded ? "crew records" : "Not loaded yet") + '</div>' +
                '</div>' +
                '<span class="arrow">→</span>' +
                '</a>';
      });

      html += '</div>';
      return html;
    }

    function activateLobby(lobby) {
      activeLobby = lobby;
      Array.prototype.forEach.call(tabsEl.querySelectorAll(".tab"), function (tab) {
        tab.classList.toggle("active", tab.dataset.lobby === lobby);
      });

      var container = document.getElementById("lobby-content-" + LOBBY_KEYS[lobby]);
      if (!container) {
        container = document.createElement("section");
        container.id = "lobby-content-" + LOBBY_KEYS[lobby];
        container.className = "tab-content";
        contentsEl.appendChild(container);
      }
      container.innerHTML = renderLobbyContent(lobby);

      Array.prototype.forEach.call(contentsEl.querySelectorAll(".tab-content"), function (el) {
        el.classList.toggle("active", el.id === container.id);
      });
    }

    function renderAll() {
      renderTabs();
      contentsEl.innerHTML = "";
      Object.keys(LOBBY_KEYS).forEach(function (lobby) {
        var container = document.createElement("section");
        container.id = "lobby-content-" + LOBBY_KEYS[lobby];
        container.className = "tab-content";
        container.innerHTML = renderLobbyContent(lobby);
        contentsEl.appendChild(container);
      });
      activateLobby(activeLobby || Object.keys(LOBBY_KEYS)[0]);
    }

    /* -------- FIREBASE LIVE LISTENER -------- */
    const dbRef = ref(db, 'crewData/');
    
    // This listens to the cloud and updates ALL_CLOUD_DATA automatically
    onValue(dbRef, (snapshot) => {
      ALL_CLOUD_DATA = snapshot.val() || {};
      renderAll(); // Re-render the dashboard with the new counts
    });

    /* -------- INIT -------- */
    document.getElementById("footerDate").textContent =
      new Date().toLocaleDateString("en-IN", {
        day: "2-digit", month: "short", year: "numeric"
      });
  })();
</script>
</body>
</html>
